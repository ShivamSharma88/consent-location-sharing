<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consent-Based Location Sharing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .info-box {
      background: #f0f4ff;
      border-left: 4px solid #667eea;
      padding: 15px;
      margin-bottom: 25px;
      border-radius: 4px;
      font-size: 14px;
      color: #555;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 14px 20px;
      margin-top: 15px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    #consentBtn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    #consentBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    #stopBtn {
      background: #e74c3c;
      color: white;
      display: none;
    }

    #stopBtn:hover:not(:disabled) {
      background: #c0392b;
      transform: translateY(-2px);
    }

    #stopBtn.show {
      display: block;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      min-height: 20px;
      font-size: 14px;
      line-height: 1.5;
    }

    #status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    #status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    #status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .location-data {
      background: #f9f9f9;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
      font-size: 13px;
      font-family: monospace;
    }

    .location-data div {
      margin: 8px 0;
      word-break: break-all;
    }

    .label {
      font-weight: 600;
      color: #333;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📍 Location Sharing</h1>
    <p class="subtitle">Share your live location with explicit consent only</p>

    <div class="info-box">
      ✓ This app only shares your location if you explicitly approve it<br>
      ✓ You can stop sharing anytime with the stop button<br>
      ✓ Your location is only sent to the server after you consent
    </div>

    <button id="consentBtn">✓ I consent and want to share my location</button>
    <button id="stopBtn" class="show">✗ Stop sharing my location</button>

    <div id="status"></div>
  </div>

  <script>
    const consentBtn = document.getElementById("consentBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusDiv = document.getElementById("status");

    let consentGiven = false;
    let watchId = null;

    function updateStatus(message, type = "info") {
      statusDiv.innerText = message;
      statusDiv.className = type;
    }

    consentBtn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        updateStatus("❌ Geolocation is not supported on this device.", "error");
        return;
      }

      consentGiven = true;
      consentBtn.style.display = "none";
      stopBtn.classList.add("show");

      updateStatus("📍 Requesting location access... Please allow location permission when prompted.", "info");

      watchId = navigator.geolocation.watchPosition(
        async (position) => {
          const payload = {
            userId: "user_" + Math.random().toString(36).substr(2, 9),
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy,
            consentGiven: true,
            consentTimestamp: new Date().toISOString()
          };

          try {
            const response = await fetch("/api/location", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (response.ok) {
              const data = await payload;
              updateStatus(
                `✓ Location shared successfully!\nLatitude: ${payload.latitude.toFixed(6)}\nLongitude: ${payload.longitude.toFixed(6)}\nAccuracy: ${payload.accuracy.toFixed(2)}m`,
                "success"
              );
            } else {
              updateStatus("❌ Failed to share location. Please try again.", "error");
            }
          } catch (error) {
            updateStatus("❌ Error sending location: " + error.message, "error");
          }
        },
        (error) => {
          let errorMsg = "Location access was denied.";
          if (error.code === 1) errorMsg = "Permission denied. Please enable location access in your browser settings.";
          if (error.code === 2) errorMsg = "Position unavailable. Please check your GPS/network connection.";
          if (error.code === 3) errorMsg = "Location request timed out.";

          updateStatus("❌ " + errorMsg, "error");
          consentGiven = false;
          consentBtn.style.display = "block";
          stopBtn.classList.remove("show");
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    });

    stopBtn.addEventListener("click", () => {
      if (watchId) {
        navigator.geolocation.clearWatch(watchId);
      }

      consentGiven = false;
      stopBtn.classList.remove("show");
      consentBtn.style.display = "block";
      updateStatus("✓ Location sharing stopped. Your privacy is protected.", "success");
    });
  </script>
</body>
</html>
